# Netlify hosts BOTH parts of LibraryMS:
#   - the static frontend  (frontend/)
#   - the Express API      (netlify/functions/api.js -> backend/)
[build]
  publish = "frontend"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # Keep these as real installed packages instead of bundling them (they read
  # data files / native-style code at run time).
  external_node_modules = ["mongoose", "pdfkit"]
  included_files = ["node_modules/pdfkit/js/data/**"]

# Every API call goes to the function. status 200 = rewrite, the URL in the
# browser stays /api/...
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
