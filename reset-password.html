<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset your password — LibraryMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260923" />
</head>
<body>
  <main style="max-width:420px;margin:80px auto;padding:0 24px;">
    <div class="brand-mark" style="margin:0 auto 20px;">§</div>
    <h1 style="font-family:'Roboto Slab',serif;font-size:26px;margin-bottom:8px;text-align:center;">Set a new password</h1>
    <p class="hint" style="text-align:center;margin-bottom:24px;">Choose a new password for your LibraryMS account.</p>

    <form id="resetForm" aria-label="Reset password form">
      <label class="field-label" for="newPassword">New password</label>
      <input type="password" id="newPassword" placeholder="At least 6 characters" minlength="6" required aria-required="true" />
      <label class="field-label" for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" placeholder="Repeat password" minlength="6" required aria-required="true" />
      <button type="submit" class="btn-primary full" style="margin-top:8px;">Reset password</button>
      <p class="modal-status" id="resetStatus" role="status" aria-live="polite"></p>
    </form>
    <p style="text-align:center;margin-top:16px;"><a href="index.html">Back to LibraryMS</a></p>
  </main>
<script src="api-config.js?v=20260923"></script>
<script>
  const API_BASE = (window.LIBRARYMS_IS_LOCAL && !["5000", "8888"].includes(window.location.port) ? "http://localhost:5000" : (window.LIBRARYMS_API_BASE || ""));
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const statusEl = document.getElementById("resetStatus");

  document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (!token) {
      statusEl.textContent = "Missing reset token — please use the link from your email.";
      statusEl.className = "modal-status error";
      return;
    }
    if (newPassword !== confirmPassword) {
      statusEl.textContent = "Passwords don't match.";
      statusEl.className = "modal-status error";
      return;
    }
    if (newPassword.length < 6) {
      statusEl.textContent = "Password must be at least 6 characters.";
      statusEl.className = "modal-status error";
      return;
    }

    statusEl.textContent = "Resetting…";
    statusEl.className = "modal-status";
    try {
      const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, newPassword }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong");
      statusEl.textContent = data.message + " Redirecting to login…";
      statusEl.className = "modal-status success";
      setTimeout(() => (window.location.href = "index.html"), 1800);
    } catch (err) {
      statusEl.textContent = err.message;
      statusEl.className = "modal-status error";
    }
  });
</script>
</body>
</html>
