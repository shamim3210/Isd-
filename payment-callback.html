<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment status — LibraryMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260923" />
</head>
<body>
  <main style="max-width:440px;margin:80px auto;padding:0 24px;text-align:center;">
    <div class="brand-mark" style="margin:0 auto 20px;">§</div>
    <h1 style="font-family:'Roboto Slab',serif;font-size:26px;margin-bottom:12px;" id="statusTitle">Confirming your payment…</h1>
    <p id="statusMsg" class="hint" style="margin-bottom:24px;">Please wait a moment.</p>
    <a href="index.html" class="btn-primary" style="display:inline-block;text-decoration:none;">Back to LibraryMS</a>
  </main>
<script src="api-config.js?v=20260923"></script>
<script>
  const API_BASE = String(
    window.LIBRARYMS_IS_LOCAL && !["5000", "8888"].includes(window.location.port)
      ? "http://localhost:5000"
      : (window.LIBRARYMS_API_BASE || "")
  ).trim().replace(/\/+$/, "");
  const token = localStorage.getItem("librarims_token");
  const params = new URLSearchParams(window.location.search);
  // bKash appends paymentID and status to the callback URL — fall back to
  // whatever we stashed before redirecting, in case the query params differ.
  const paymentID = params.get("paymentID") || localStorage.getItem("librarims_pending_payment");
  const bkashStatus = params.get("status"); // "success" | "failure" | "cancel"

  const titleEl = document.getElementById("statusTitle");
  const msgEl = document.getElementById("statusMsg");

  if (bkashStatus === "cancel" || bkashStatus === "failure") {
    titleEl.textContent = "Payment not completed";
    msgEl.textContent = "You cancelled or the payment failed. No charge was made — you can try again from My Loans.";
  } else if (!paymentID || !token) {
    titleEl.textContent = "Missing payment info";
    msgEl.textContent = "We couldn't find your payment details. If you completed payment, check My Loans — it may already be reflected.";
  } else {
    fetch(`${API_BASE}/api/payments/bkash/execute`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ paymentID }),
    })
      .then((r) => r.json().then((data) => ({ ok: r.ok, data })))
      .then(({ ok, data }) => {
        if (ok) {
          titleEl.textContent = "Payment successful ✓";
          msgEl.textContent = data.message;
          localStorage.removeItem("librarims_pending_payment");
        } else {
          titleEl.textContent = "Payment couldn't be confirmed";
          msgEl.textContent = data.error || "Please check My Loans, or contact the librarian if you were charged.";
        }
      })
      .catch(() => {
        titleEl.textContent = "Couldn't reach the server";
        msgEl.textContent = "Check your connection, then check My Loans to confirm whether the fine was cleared.";
      });
  }
</script>
</body>
</html>
